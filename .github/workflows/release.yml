name: Build and release

on:
  pull_request:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
          - os: windows-2022
            platform: win
            arch: x64
          - os: ubuntu-22.04
            platform: linux
            arch: x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || format('refs/tags/{0}', env.RELEASE_TAG) }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libfuse2 libsecret-1-0 gnome-keyring dbus-x11 libgtk-3-0 libnss3 libasound2
      - name: Set package version from tag
        if: github.event_name != 'pull_request'
        run: |
          # npm validates the version; only the runner's working copy is changed.
          VERSION="${RELEASE_TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a version tag such as v1.2.3 or v1.2.3-beta.1" >&2
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version --ignore-scripts
      - run: npm run test:unit
      - name: Test account authentication through desktop proxy
        if: runner.os != 'Linux'
        run: npm run test:kimi-network
      - name: Test macOS update installation
        if: runner.os == 'macOS'
        run: npm run test:update:mac
      - name: Build installers
        run: npm run dist -- --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test installed Windows application
        if: runner.os == 'Windows'
        run: npm run test:installed
      - name: Test Linux AppImage with a real keyring
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- xvfb-run -a bash -euo pipefail -c '
            export XDG_CURRENT_DESKTOP=GNOME
            eval "$(printf "ci-test-password" | gnome-keyring-daemon --unlock --components=secrets)"
            npm run test:installed
          '
      - name: Save installation diagnostics
        if: always() && runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: installation-check-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/installed
          if-no-files-found: ignore
      - name: Save installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/*.yml
            !dist/builder*.yml

  release:
    name: Upload release assets
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Manual rebuilds use current release tooling; application builds still use the tag.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: build-artifacts
      - name: Merge and verify update manifests
        run: node scripts/prepare-release.mjs build-artifacts installers
      - name: Create draft if needed and upload installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" --json body --jq .body > existing-notes.md; then
            RELEASE_EXISTS=true
          else
            RELEASE_EXISTS=false
            : > existing-notes.md
          fi
          node scripts/release-notes.mjs --tag "$RELEASE_TAG" --repo "$GH_REPO" --existing existing-notes.md --output release-notes.md
          if [[ "$RELEASE_EXISTS" == false ]]; then
            OPTIONS=(--draft --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md)
            if [[ "$RELEASE_TAG" == *-* ]]; then
              OPTIONS+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${OPTIONS[@]}"
          else
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md
          fi
          # Upload update metadata last, so clients never discover missing installer assets.
          shopt -s nullglob
          ASSETS=(installers/*.dmg installers/*.zip installers/*.exe installers/*.AppImage installers/*.blockmap)
          gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --clobber
          gh release upload "$RELEASE_TAG" installers/*.yml --clobber
